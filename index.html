<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100d">
  <meta name="description" content="Browse Kihira's Old School RuneScape tools, RuneLite plugins, and clan projects.">
  <title>Kihira's Toolkit</title>
  <link rel="stylesheet" href="./toolkit-common/toolkit.css">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./site.mjs"></script>
</head>
<body>
  <header id="toolkit-header"></header>
  <main id="main" class="toolkit-container project-directory">
    <h1 class="visually-hidden">Kihira's Toolkit</h1>

    <section class="project-section" aria-labelledby="tools-heading">
      <h2 id="tools-heading">Tools</h2>
      <ul class="project-grid">
        <li class="project-entry">
          <a class="panel project-card" href="https://kihiralove.github.io/osrs-boss-loot-simulators/">
            <img class="project-icon project-icon--sprite" src="./assets/loot-simulators.png" width="64" height="64" alt="">
            <h3>OSRS Boss Loot Simulators</h3>
          </a>
        </li>
        <li class="project-entry">
          <a class="panel project-card" href="https://kihiralove.github.io/bingo-player-stats/">
            <img class="project-icon project-icon--sprite" src="./assets/security-book.png" width="64" height="64" alt="">
            <h3>Bingo Player Stats</h3>
          </a>
        </li>
      </ul>
    </section>

    <section class="project-section" aria-labelledby="runelite-heading">
      <h2 id="runelite-heading">RuneLite Plugins</h2>
      <ul class="project-grid project-grid--plugins">
        <li class="project-entry">
          <a class="panel project-card" href="https://runelite.net/plugin-hub/show/big-pets" target="_blank" rel="noopener noreferrer">
            <img class="project-icon" src="./assets/big-pets.png" width="64" height="64" alt="">
            <h3>Big Pets</h3>
          </a>
          <img class="project-installs" src="https://img.shields.io/endpoint?url=https://api.runelite.net/pluginhub/shields/installs/plugin/big-pets" height="20" alt="Big Pets total installs">
        </li>
        <li class="project-entry">
          <a class="panel project-card" href="https://runelite.net/plugin-hub/show/racecar" target="_blank" rel="noopener noreferrer">
            <img class="project-icon" src="./assets/racecar.png" width="64" height="64" alt="">
            <h3>Racecar</h3>
          </a>
          <img class="project-installs" src="https://img.shields.io/endpoint?url=https://api.runelite.net/pluginhub/shields/installs/plugin/racecar" height="20" alt="Racecar total installs">
        </li>
        <li class="project-entry">
          <a class="panel project-card" href="https://runelite.net/plugin-hub/show/puppy-finder" target="_blank" rel="noopener noreferrer">
            <img class="project-icon" src="./assets/puppy-finder.png" width="64" height="64" alt="">
            <h3>Puppy Finder</h3>
          </a>
          <img class="project-installs" src="https://img.shields.io/endpoint?url=https://api.runelite.net/pluginhub/shields/installs/plugin/puppy-finder" height="20" alt="Puppy Finder total installs">
        </li>
        <li class="project-entry">
          <a class="panel project-card" href="https://runelite.net/plugin-hub/show/clan-clog-client" target="_blank" rel="noopener noreferrer">
            <img class="project-icon" src="./assets/vard-the-clogger.png" width="64" height="64" alt="">
            <h3>Clan Clog Client</h3>
          </a>
          <img class="project-installs" src="https://img.shields.io/endpoint?url=https://api.runelite.net/pluginhub/shields/installs/plugin/clan-clog-client" height="20" alt="Clan Clog Client total installs">
        </li>
      </ul>
    </section>

    <section class="project-section" aria-labelledby="misc-heading">
      <h2 id="misc-heading">Misc</h2>
      <ul class="project-grid">
        <li class="project-entry">
          <a class="panel project-card" href="https://github.com/KihiraLove/clan-clog">
            <img class="project-icon" src="./assets/vard-the-clogger.png" width="64" height="64" alt="">
            <h3>Clan Collection Log</h3>
          </a>
        </li>
        <li class="project-entry">
          <a class="panel project-card" href="https://kihiralove.github.io/clan-clog-submitter/">
            <img class="project-icon" src="./assets/vard-the-clogger.png" width="64" height="64" alt="">
            <h3>Clan Clog Submitter</h3>
          </a>
        </li>
      </ul>
    </section>
  </main>
  <footer id="toolkit-footer">
    <div class="toolkit-footer-info">
      <p>Old School RuneScape tools and projects by KihiraLove.</p>
    </div>
  </footer>
</body>
</html>
